name: CI

on:
  push:
  pull_request:

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify paper-aligned artifacts
        run: python scripts/verify_release.py
